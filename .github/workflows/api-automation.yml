name: API Automation

on:
  push:
    paths:
      - "api-automation/**"
      - ".github/workflows/api-automation.yml"
  pull_request:
    paths:
      - "api-automation/**"
      - ".github/workflows/api-automation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    defaults:
      run:
        working-directory: api-automation

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: api-automation/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run static checks
        run: ruff check api_client.py tests/

      - name: Run isolated unit tests
        run: pytest -m unit -ra

      - name: Run complete API test suite
        run: |
          mkdir -p reports
          pytest -ra --junitxml=reports/junit.xml --alluredir=allure-results

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-automation-python-${{ matrix.python-version }}
          path: |
            api-automation/reports/
            api-automation/allure-results/
          if-no-files-found: warn
          retention-days: 14
