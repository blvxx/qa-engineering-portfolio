services:
  warehouse:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: warehouse
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse_demo_only
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse -d warehouse"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - warehouse_data:/var/lib/postgresql/data

  pipeline:
    image: python:3.11-slim
    working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      WAREHOUSE_DSN: postgresql://warehouse:warehouse_demo_only@warehouse:5432/warehouse
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             python src/pipeline.py"
    depends_on:
      warehouse:
        condition: service_healthy

  airflow:
    image: apache/airflow:2.10.5-python3.11
    command: standalone
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      _PIP_ADDITIONAL_REQUIREMENTS: psycopg2-binary
      WAREHOUSE_DSN: postgresql://warehouse:warehouse_demo_only@warehouse:5432/warehouse
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
    depends_on:
      warehouse:
        condition: service_healthy

volumes:
  warehouse_data:
