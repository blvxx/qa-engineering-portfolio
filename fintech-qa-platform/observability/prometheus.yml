global:
  scrape_interval: 10s
  evaluation_interval: 10s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: payment-service
    metrics_path: /metrics
    static_configs:
      - targets: ["payment:8000"]
        labels:
          environment: demo
  - job_name: ledger-service
    metrics_path: /metrics
    static_configs:
      - targets: ["ledger:8001"]
        labels:
          environment: demo
